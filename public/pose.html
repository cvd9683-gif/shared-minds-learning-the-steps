<!DOCTYPE html><html><head><meta charset="utf-8"><title>poses</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 0; display: flex; }
  .cell { width: 300px; position: relative; }
  .cell .dancer-svg { height: 430px; }
  .cell p { margin: 0; text-align: center; font: 600 15px var(--font-text); }
</style>
</head><body>
<script type="module">
// A scratch page for looking at the drawing: one dancer per named move.
// ?moves=rest,jump,drop,spin  — and &t=0.45 to hold a moment inside the move.
import { Dancer } from "./js/dancer.js";
import { label } from "./js/phrase.js";

const params = new URLSearchParams(location.search);
// "jump@0.5" holds that move half way through, so a moment mid-air can be looked at.
const moves = (params.get("moves") || "rest").split(",");
const span = Number(params.get("span")) || 620;

for (const spec of moves) {
  const [m, at] = spec.split("@");
  const hold = at === undefined ? (params.has("t") ? Number(params.get("t")) : null) : Number(at);
  const cell = document.createElement("div");
  cell.className = "cell";
  document.body.append(cell);
  const d = new Dancer(cell);
  d.calm = 1;
  const caption = document.createElement("p");
  caption.textContent = m === "rest" ? "standing" : label(m);
  cell.append(caption);

  const begun = performance.now();
  if (m !== "rest") d.perform(m, "you", begun, span);

  let last = begun;
  const tick = (now) => {
    // With ?t, freeze at that fraction of the move by feeding the clock by hand.
    const at = hold === null ? now : begun + hold * span;
    d.energy = hold === null ? d.energy : 0;
    d.update(Math.min(64, now - last), at);
    last = now;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script></body></html>
